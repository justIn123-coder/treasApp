    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        /* Prevent elastic scroll on body, let main handle it */
        overflow: hidden; 
      }
      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.5s ease-out;
      }
      @keyframes fade-in-down {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes highlight-pulse {
        0% { transform: scale(1); background-color: white; border-color: #e2e8f0; }
        15% { transform: scale(1.02); background-color: #eff6ff; border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        85% { transform: scale(1.02); background-color: #eff6ff; border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        100% { transform: scale(1); background-color: white; border-color: #e2e8f0; }
      }

      .student-payment-highlight {
        animation: highlight-pulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        z-index: 10;
        position: relative;
      }

      button, a {
        touch-action: manipulation;
      }
      .prevent-select {
        -webkit-user-select: none;
        user-select: none;
      }

      /* Custom styles for PWA standalone mode padding */
      @supports (padding: env(safe-area-inset-top)) {
        main {
          padding-top: env(safe-area-inset-top);
        }
      }
    </style>

}
</script>

  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => {
                console.log('[TreasApp] SW registered:', reg.scope);
                
                // If the SW is updated, check for content change
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    if (installingWorker == null) return;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed') {
                            if (navigator.serviceWorker.controller) {
                                // New content available; can notify user
                                console.log('[TreasApp] New content is available; please refresh.');
                            } else {
                                // Content is cached for offline use
                                console.log('[TreasApp] Content is cached for offline use.');
                            }
                        }
                    };
                };
            })
            .catch(err => console.warn('[TreasApp] SW registration failed:', err.message));
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
